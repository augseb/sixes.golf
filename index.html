<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overscroll-behavior-x:none}
body{font-family:'EB Garamond',Georgia,serif;color:#1f3d2b;background:#2f4a33;-webkit-text-size-adjust:100%;font-size:17px;line-height:1.3}
.mark{font-weight:500;letter-spacing:.06em;line-height:1;text-transform:uppercase;padding-left:.06em;white-space:nowrap;position:relative}
.dom{text-transform:none!important;letter-spacing:.04em;font-style:italic}
.ks{position:relative;display:inline-block;line-height:1}
.ks::after{content:'';position:absolute;top:.13em;height:.798em;width:max(.054em,1px);left:calc(50% - var(--ls,.06em) / 2 - .027em);background:currentColor;border-radius:1em;pointer-events:none}
.mark .dom.hang{position:absolute;left:100%;bottom:0;font-weight:400;font-style:italic;letter-spacing:.01em;font-size:.3em;line-height:1.75;margin-left:-.2em}
.logo{width:100%;display:flex;flex-direction:column;align-items:center;gap:6px}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
#stage{position:fixed;inset:0;overflow:hidden}
#scroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:36px 20px 40px;display:flex;justify-content:center}
.paper{background-color:#f3f2ec;background-image:radial-gradient(rgba(70,70,60,.07) 1px,transparent 1.2px),radial-gradient(rgba(70,70,60,.05) 1px,transparent 1.2px);background-size:7px 7px,11px 11px;background-position:0 0,3px 5px}
#card{position:relative;width:100%;max-width:410px;border-radius:6px;box-shadow:0 2px 4px rgba(0,0,0,.25),0 22px 44px rgba(0,0,0,.45);padding:14px 14px 16px;display:flex;flex-direction:column;gap:12px;align-self:stretch;height:max-content;min-height:100%;min-height:calc(100dvh - 76px)}
.fine{font-size:14px;color:#4b5f52;line-height:1.3}
.btn{min-height:52px;display:flex;align-items:center;justify-content:center;gap:8px;border:1.5px solid #1f3d2b;border-radius:4px;background:transparent;font-size:19px;font-weight:700;text-decoration:none;padding:6px 12px;text-align:center}
.btn.dark{background:#1f3d2b;color:#f7f6f1;border-color:#1f3d2b}
.btn:disabled{opacity:.35;cursor:default}
.grow{flex:1}
.hw{font-family:'Caveat',cursive;color:#3f3e3b;display:inline-block;line-height:1;padding:.1em .22em}
.dbl{width:100%;height:3px;border-top:1.5px solid #1f3d2b;border-bottom:.75px solid #1f3d2b}
.dbl.b{border-top-width:.75px;border-bottom-width:1.5px}
@keyframes wig{0%{transform:translateX(0)}15%{transform:translateX(-7px) rotate(-.4deg)}32%{transform:translateX(6px) rotate(.3deg)}50%{transform:translateX(-4px)}68%{transform:translateX(2.5px)}84%{transform:translateX(-1px)}100%{transform:translateX(0)}}
.wel{display:flex;flex-direction:column;align-items:center;gap:10px;width:100%}
.ask{font-size:20px;text-align:center}
.code{width:100%;height:56px;border:none;border-bottom:1.5px solid #1f3d2b;background:transparent;font-family:'Caveat',cursive!important;font-size:30px!important;color:#3f3e3b;text-align:center;outline:none;border-radius:0;padding:0}
.code:focus{border-bottom-width:2.5px}
.code.wig{animation:wig .34s cubic-bezier(.36,.07,.19,.97)}
.miss{min-height:20px;text-align:center;opacity:0;transition:opacity .3s}
.miss.on{opacity:1}
.wel .btn{align-self:stretch;width:100%}
.mail{text-align:center}
.mail a{color:#1f3d2b;font-weight:700;text-decoration:none}

</style></head><body>
<div id="stage"><div id="scroll"><div id="card" class="paper quiet">
<div class="grow" style="max-height:14px"></div>
<div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div class="logo"><div class="dbl"></div>
<div class="mark" role="img" aria-label="SIXES.golf" style="font-size:56px"><span class="ks">S</span>IXES<span class="dom hang">.golf</span></div>
<div class="tagl">A game in three sixes.</div><div class="dbl b"></div>
<div class="vers">Beta 3.1.2</div></div></div>
<div class="grow"></div>
<form class="wel" id="f" autocomplete="off">
<div class="ask">Beta. Code, please.</div>
<input class="code" id="c" type="text" inputmode="text" autocapitalize="none" autocorrect="off" spellcheck="false" aria-label="Beta code">
<div class="fine miss" id="m">Not that one.</div>
<button class="btn dark" id="b" type="submit" disabled>Tee It Up</button>
</form>
<div class="grow" style="max-height:28px"></div>
<div class="fine mail">No code? <a href="mailto:feedback@sixes.golf">feedback@sixes.golf</a></div>
</div></div></div>
<script>(function(){
var card=document.getElementById('card'),f=document.getElementById('f'),c=document.getElementById('c'),b=document.getElementById('b'),m=document.getElementById('m');
var KEY='sixes.key',enc=null,busy=false;
if('serviceWorker' in navigator)try{navigator.serviceWorker.register('sw.js')}catch(e){}
function b64(a){return btoa(String.fromCharCode.apply(null,new Uint8Array(a)))}
function unb64(s){var t=atob(s),u=new Uint8Array(t.length);for(var i=0;i<t.length;i++)u[i]=t.charCodeAt(i);return u.buffer}
function blob(){if(enc)return Promise.resolve(enc);return fetch('app.enc',{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error('no app');return r.arrayBuffer()}).then(function(a){enc=a;return a})}
function parts(a){var u=new Uint8Array(a);if(String.fromCharCode(u[0],u[1],u[2],u[3])!=='SXG1')throw new Error('bad file');return{salt:u.slice(4,20),nonce:u.slice(20,32),ct:u.slice(32)}}
function keyFromCode(code,salt){var s=window.crypto.subtle;return s.importKey('raw',new TextEncoder().encode(code),'PBKDF2',false,['deriveKey']).then(function(k){return s.deriveKey({name:'PBKDF2',salt:salt,iterations:250000,hash:'SHA-256'},k,{name:'AES-GCM',length:256},true,['decrypt'])})}
function open(key,p){return window.crypto.subtle.decrypt({name:'AES-GCM',iv:p.nonce,additionalData:new TextEncoder().encode('SXG1')},key,p.ct).then(function(pt){return new TextDecoder().decode(pt)})}
function boot(html){document.open();document.write(html);document.close()}
function remember(key){return window.crypto.subtle.exportKey('raw',key).then(function(raw){try{localStorage.setItem(KEY,b64(raw))}catch(e){}})}
function show(){card.classList.remove('quiet');try{c.focus()}catch(e){}}
function miss(){m.classList.add('on');c.classList.remove('wig');void c.offsetWidth;c.classList.add('wig');b.disabled=!c.value.trim();busy=false;b.textContent='Tee It Up'}
// a phone that already has the key opens straight in
var saved=null;try{saved=localStorage.getItem(KEY)}catch(e){}
if(saved&&window.crypto&&window.crypto.subtle){blob().then(function(a){var p=parts(a);return window.crypto.subtle.importKey('raw',unb64(saved),{name:'AES-GCM'},true,['decrypt']).then(function(k){return open(k,p)})}).then(boot).catch(function(){try{localStorage.removeItem(KEY)}catch(e){}show()})}
else show();
c.addEventListener('input',function(){b.disabled=!c.value.trim()||busy;m.classList.remove('on')});
f.addEventListener('submit',function(e){e.preventDefault();if(busy)return;var code=c.value.trim().toLowerCase().replace(/\s+/g,' ');if(!code)return;busy=true;b.disabled=true;b.textContent='One sec…';
 if(!(window.crypto&&window.crypto.subtle)){m.textContent='This browser can’t open the beta. Try Safari or Chrome.';m.classList.add('on');busy=false;return}
 blob().then(function(a){var p=parts(a);return keyFromCode(code,p.salt).then(function(k){return open(k,p).then(function(html){return remember(k).then(function(){boot(html)})})})}).catch(function(err){if(err&&/no app|bad file|Failed to fetch|NetworkError/.test(String(err))){m.textContent='No signal. The first open needs one.';m.classList.add('on');busy=false;b.disabled=false;b.textContent='Tee It Up';return}m.textContent='Not that one.';miss()})});
})();</script>

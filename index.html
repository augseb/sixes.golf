<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>SIXES.golf</title>
<meta name="robots" content="noindex, nofollow">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="SIXES.golf">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1f3d2b">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&family=EB+Garamond:ital,wght@0,400..700;1,400..700&display=swap">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overscroll-behavior:none;background:#1f3d2b}
body{font-family:'EB Garamond',Georgia,serif;color:#f3f2ec;-webkit-text-size-adjust:100%;font-size:17px;line-height:1.3}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
#card{position:fixed;inset:0;overflow:hidden;background:#1f3d2b}
.mk{position:absolute;display:block;overflow:visible}
#top,#bot{position:absolute;left:34px;right:34px;display:flex;flex-direction:column;align-items:center}
#bot{gap:16px}
.ask{font-size:20px;line-height:26px;color:#e4e6dc;text-align:center}
.code{width:100%;height:52px;margin-top:4px;border:none;border-bottom:1.5px solid #f3f2ec;background:transparent;font-family:'Caveat',cursive!important;font-size:30px!important;color:#f3f2ec;text-align:center;outline:none;border-radius:0;padding:0}
.code:focus{border-bottom-width:2.5px}
@keyframes wig{0%{transform:translateX(0)}15%{transform:translateX(-7px) rotate(-.4deg)}32%{transform:translateX(6px) rotate(.3deg)}50%{transform:translateX(-4px)}68%{transform:translateX(2.5px)}84%{transform:translateX(-1px)}100%{transform:translateX(0)}}
.code.wig{animation:wig .34s cubic-bezier(.36,.07,.19,.97)}
.miss{min-height:20px;margin-top:6px;font-size:14px;color:#c9d0c6;text-align:center;opacity:0;transition:opacity .3s}
.miss.on{opacity:1}
.btn{width:100%;min-height:52px;border:0;border-radius:8px;background:#f3f2ec;color:#1f3d2b;font-size:21px;font-weight:700}
.btn:disabled{opacity:.4;cursor:default}
.mail{font-size:14px;color:#a9b8ad;text-align:center}
.mail a{color:#f3f2ec;font-weight:700;text-decoration:none}
#card.quiet form,#card.quiet #bot .mail{visibility:hidden}
#card.gone form,#card.gone .mail{transition:opacity .18s ease;opacity:0;pointer-events:none}
@media (prefers-reduced-motion:reduce){.code.wig{animation:none}}
</style></head><body>
<div id="card" class="quiet">
<svg id="gS" class="mk" viewBox="34 189 400 679" width="124" height="210.49" role="img" aria-label="SIXES.golf"><path d="M209 868Q167 868 130 856Q93 845 62 822Q58 818 54 812Q49 807 47 801Q40 778 38 743Q35 709 34 682Q34 675 40 671Q46 668 54 668Q61 668 66 670Q70 673 72 680Q93 756 134 793Q175 831 223 831Q257 831 282 816Q306 801 320 775Q334 750 334 718Q334 680 321 656Q308 632 283 613Q258 594 221 572Q181 548 142 522Q104 496 79 461Q54 426 54 375Q54 321 80 279Q105 238 154 213Q203 189 272 189Q308 189 338 196Q367 204 385 212Q394 215 400 222Q405 229 408 239Q413 260 419 288Q425 316 425 345Q425 356 409 356Q400 356 392 352Q384 348 382 342Q362 286 332 257Q303 228 258 228Q228 228 204 238Q179 249 164 272Q150 296 150 334Q150 361 168 384Q187 408 218 429Q250 451 289 474Q330 499 363 526Q396 553 415 587Q434 622 434 670Q434 733 406 777Q378 822 328 845Q277 868 209 868Z" fill="#f3f2ec"/></svg>
<svg id="gT" class="mk" viewBox="124 880 177 273" width="54.87" height="84.63" aria-hidden="true"><path d="M124,881 L132,884 L140,886 L148,887 L156,889 L164,890 L172,892 L180,892 L188,893 L196,894 L204,894 L212,894 L220,894 L228,893 L236,893 L244,892 L252,892 L260,890 L268,889 L276,887 L284,886 L292,884 L300,881 L300,881 Q296,903 266,921 Q246,933 240,947 L218,1141 Q212,1152 206,1141 L184,947 Q180,933 158,921 Q128,903 124,881 Z" fill="#f3f2ec"/></svg>
<form id="f" autocomplete="off">
<div id="top"><div class="ask">Beta. Code, please.</div>
<input class="code" id="c" type="text" inputmode="text" enterkeyhint="go" autocapitalize="none" autocorrect="off" spellcheck="false" aria-label="Beta code">
<div class="miss" id="m">Not that one.</div></div>
<div id="bot"><button class="btn" id="b" type="submit" disabled>Tee It Up</button>
<div class="mail">No code? <a href="mailto:feedback@sixes.golf">feedback@sixes.golf</a></div></div>
</form>
</div>
<script>(function(){
var card=document.getElementById('card'),f=document.getElementById('f'),c=document.getElementById('c'),b=document.getElementById('b'),m=document.getElementById('m');
var KEY='sixes.key',enc=null,busy=false;
if('serviceWorker' in navigator)try{navigator.serviceWorker.register('sw.js')}catch(e){}
function b64(a){return btoa(String.fromCharCode.apply(null,new Uint8Array(a)))}
function unb64(s){var t=atob(s),u=new Uint8Array(t.length);for(var i=0;i<t.length;i++)u[i]=t.charCodeAt(i);return u.buffer}
function blob(){if(enc)return Promise.resolve(enc);return fetch('app.enc',{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error('no app');return r.arrayBuffer()}).then(function(a){enc=a;return a})}
function parts(a){var u=new Uint8Array(a);if(String.fromCharCode(u[0],u[1],u[2],u[3])!=='SXG1')throw new Error('bad file');return{salt:u.slice(4,20),nonce:u.slice(20,32),ct:u.slice(32)}}
function keyFromCode(code,salt){var s=window.crypto.subtle;return s.importKey('raw',new TextEncoder().encode(code),'PBKDF2',false,['deriveKey']).then(function(k){return s.deriveKey({name:'PBKDF2',salt:salt,iterations:250000,hash:'SHA-256'},k,{name:'AES-GCM',length:256},true,['decrypt'])})}
function open(key,p){return window.crypto.subtle.decrypt({name:'AES-GCM',iv:p.nonce,additionalData:new TextEncoder().encode('SXG1')},key,p.ct).then(function(pt){return new TextDecoder().decode(pt)})}
function boot(html){document.open();document.write(html);document.close()}
// Beta 3.2.1: the right code's Tee It Up (or return) is the swing. The sound is opened on the tap itself, so the show can play it.
function unlockSound(){try{if(window.__sixesAC)return;var C=window.AudioContext||window.webkitAudioContext;if(!C)return;try{if(navigator.audioSession)navigator.audioSession.type='ambient'}catch(x){}var a=window.__sixesAC=new C();var s=a.createBufferSource();s.buffer=a.createBuffer(1,1,22050);s.connect(a.destination);s.start(0);if(a.state==='suspended')a.resume()}catch(x){}}
function swing(html){try{sessionStorage.setItem('sixes.swing','1')}catch(x){}window.__swingNow=true;card.classList.add('gone');setTimeout(function(){boot(html)},180)}
// the S and its tee sit where the app's own hold sits: 124px wide, centered, a little low. The code line 72px above the S, Tee It Up 72px below the tee.
function place(){var vw=window.innerWidth||390,vh=window.innerHeight||844,k=0.31,w=124,h=963*k,x=(vw-w)/2,y=vh*(466.2/844)-h/2;
 var s=document.getElementById('gS'),t=document.getElementById('gT'),top=document.getElementById('top'),bot=document.getElementById('bot');
 s.style.left=x+'px';s.style.top=y+'px';t.style.left=(x+90*k)+'px';t.style.top=(y+691*k)+'px';
 top.style.top=Math.max(12,y-72-82)+'px';bot.style.top=(y+h+72)+'px'}
place();window.addEventListener('resize',function(){if(!document.activeElement||document.activeElement!==c)place()});
function remember(key){return window.crypto.subtle.exportKey('raw',key).then(function(raw){try{localStorage.setItem(KEY,b64(raw))}catch(e){}})}
function show(){card.classList.remove('quiet')}
function miss(){m.classList.add('on');c.classList.remove('wig');void c.offsetWidth;c.classList.add('wig');b.disabled=!c.value.trim();busy=false;b.textContent='Tee It Up'}
// a phone that already has the key opens straight in
var saved=null;try{saved=localStorage.getItem(KEY)}catch(e){}
if(saved&&window.crypto&&window.crypto.subtle){blob().then(function(a){var p=parts(a);return window.crypto.subtle.importKey('raw',unb64(saved),{name:'AES-GCM'},true,['decrypt']).then(function(k){return open(k,p)})}).then(boot).catch(function(){try{localStorage.removeItem(KEY)}catch(e){}show()})}
else show();
c.addEventListener('input',function(){b.disabled=!c.value.trim()||busy;m.classList.remove('on')});
f.addEventListener('submit',function(e){e.preventDefault();if(busy)return;unlockSound();try{c.blur()}catch(x){}var code=c.value.trim().toLowerCase().replace(/\s+/g,' ');if(!code)return;busy=true;b.disabled=true;b.textContent='One sec…';
 if(!(window.crypto&&window.crypto.subtle)){m.textContent='This browser can’t open the beta. Try Safari or Chrome.';m.classList.add('on');busy=false;return}
 blob().then(function(a){var p=parts(a);return keyFromCode(code,p.salt).then(function(k){return open(k,p).then(function(html){return remember(k).then(function(){swing(html)})})})}).catch(function(err){if(err&&/no app|bad file|Failed to fetch|NetworkError/.test(String(err))){m.textContent='No signal. The first open needs one.';m.classList.add('on');busy=false;b.disabled=false;b.textContent='Tee It Up';return}m.textContent='Not that one.';miss()})});
})();</script>
</body></html>
